<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030816" />
  <title>Lockin | رابط الموقع وكود التفعيل</title>
  <style>
    :root {
      --bg1:#020612;
      --bg2:#07132c;
      --card:rgba(255,255,255,.08);
      --card-2:rgba(255,255,255,.05);
      --line:rgba(255,255,255,.10);
      --text:#f6f7fb;
      --muted:#b8c0d4;
      --accent:#c9a85d;
      --accent-soft:rgba(201,168,93,.16);
      --shadow:0 18px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body {
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(201,168,93,.16), transparent 24%),
        radial-gradient(circle at top right, rgba(29,78,216,.18), transparent 24%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .wrap {
      width:min(560px, 100%);
    }
    .card {
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:34px;
      padding:26px 20px 22px;
      text-align:center;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .card::before {
      content:"";
      position:absolute;
      width:210px;
      height:210px;
      border-radius:50%;
      right:-60px;
      top:-60px;
      background:radial-gradient(circle, rgba(201,168,93,.22), transparent 68%);
      pointer-events:none;
    }
    .logo-box {
      width:120px;
      height:120px;
      margin:0 auto 16px;
      border-radius:30px;
      background:rgba(255,255,255,.95);
      border:1px solid rgba(255,255,255,.18);
      display:grid;
      place-items:center;
      box-shadow:0 15px 34px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .logo-box img {
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .eyebrow {
      display:inline-block;
      padding:8px 13px;
      border-radius:999px;
      background:var(--card-2);
      border:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      margin-bottom:10px;
    }
    h1 {
      margin:0;
      font-size:clamp(30px, 6vw, 46px);
      line-height:1.1;
      letter-spacing:-0.8px;
    }
    .sub {
      margin:10px auto 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.9;
      max-width:430px;
    }
    .grid {
      display:grid;
      gap:14px;
      margin-top:20px;
    }
    .item {
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:16px;
      text-align:right;
    }
    .label {
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      margin-bottom:7px;
    }
    .site-link {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      text-decoration:none;
      color:var(--text);
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:14px 15px;
    }
    .site-link span {
      font-size:17px;
      font-weight:900;
      letter-spacing:.2px;
      direction:ltr;
    }
    .open {
      min-width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:12px;
      background:var(--accent-soft);
      color:var(--accent);
      font-weight:900;
      border:1px solid rgba(201,168,93,.18);
    }
    .code {
      background:linear-gradient(180deg, rgba(201,168,93,.14), rgba(201,168,93,.08));
      border:1px solid rgba(201,168,93,.25);
      border-radius:18px;
      padding:16px 14px;
      text-align:center;
    }
    .code-num {
      font-size:29px;
      font-weight:1000;
      letter-spacing:2px;
      color:var(--accent);
      direction:ltr;
    }
    .hint {
      margin-top:8px;
      font-size:12px;
      color:var(--muted);
    }
    .footer {
      margin-top:18px;
      color:#8f98ad;
      font-size:12px;
      line-height:1.8;
    }
    @media (max-width:520px) {
      .card {padding:22px 14px 18px; border-radius:28px;}
      .logo-box {width:104px;height:104px;border-radius:26px;}
      .site-link span {font-size:16px;}
      .code-num {font-size:24px;letter-spacing:1.5px;}
    }
  </style>
</head>
